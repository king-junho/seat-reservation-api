spring:
  datasource:
    url: jdbc:mysql://localhost:3306/seat_reservation
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  issuer: seat-reservation-api
  audience: seat-reservation-api
  access-token-ttl: 15m

